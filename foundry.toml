[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./reports" }]

[rpc_endpoints]
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/alch_Sr5zl1GDSPzo9-wtwvQnX"

[lint]
exclude_lints = ["reentrancy-no-eth", "reentrancy-events", "calls-loop", "missing-zero-check", "unaliased-plain-import", "missing-events-access-control"]
