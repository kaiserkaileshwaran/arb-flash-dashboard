name: Arbitrum One 24x7 Cloud Flash Loan Sniper & US-East Keep-Alive

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/arb_24x7_cloud_sniper.yml'
  workflow_dispatch:

concurrency:
  group: arb-sniper-24x7-cloud
  cancel-in-progress: true

jobs:
  cloud-sniper-stopped:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Cloud Sniper Stopped
        run: |
          echo "Cloud sniper server and recurring cron/self-chain loop have been cleanly stopped."
