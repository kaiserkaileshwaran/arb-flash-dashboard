name: Arbitrum One 24x7 Cloud Flash Loan Sniper & US-East Keep-Alive

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: arb-sniper-24x7-cloud
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cloud-sniper-24x7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 & C/Assembly Compiler
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Foundry (cast) for On-Chain Flash-Swap Broadcasts
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile Native C/Assembly Uncapped Flash Sniper Daemon
        run: |
          sudo apt-get update -y && sudo apt-get install -y libcurl4-openssl-dev
          mkdir -p bin reports
          gcc -O3 -march=native -flto -ffast-math -funroll-loops -S engine/arb_sniper_daemon.c -o engine/arb_sniper_daemon_cloud_x86_64.s || true
          gcc -O3 -march=native -flto -ffast-math -funroll-loops -fPIC -shared engine/arb_sniper_daemon.c -lcurl -lpthread -lm -o bin/libarb_asm_kernel.so || true
          gcc -O3 -march=native -flto -ffast-math -funroll-loops engine/arb_sniper_daemon.c -lcurl -lpthread -lm -o bin/arb_sniper_asm

      - name: Run 24/7 Cloud Arbitrum One Uncapped Assembly Sniper & Auto-Mudrex Broadcaster
        env:
          OWNER_PROFIT_WALLET: "0xFF3c34DAF159741C931F7c421350f8289A9d89BE"
          MUDREX_DEPOSIT_WALLET: "0xd2529585059e3e5c09c912f0f9570000c2a53f05"
          DEPLOYED_CONTRACT_ADDRESS: "0xeFA5Ff871fD48e23CcC3A9DCD2444f3727007Bd3"
          LOCAL_RELAYER_ADDRESS: "0x9dD041dbd964DE086Da8f907518f6E25c45aea70"
          LOCAL_RELAYER_PRIVATE_KEY: ${{ secrets.LOCAL_RELAYER_PRIVATE_KEY }}
        run: |
          if [ -n "$LOCAL_RELAYER_PRIVATE_KEY" ]; then
            printf "LOCAL_RELAYER_ADDRESS=0x9dD041dbd964DE086Da8f907518f6E25c45aea70\nLOCAL_RELAYER_PRIVATE_KEY=%s\n" "$LOCAL_RELAYER_PRIVATE_KEY" > ~/.arb_flash_local_relayer.env
            chmod 600 ~/.arb_flash_local_relayer.env
          fi
          ./bin/arb_sniper_asm --self-test || true
          ./bin/arb_sniper_asm --daemon > /tmp/arb_sniper_asm_cloud.log 2>&1 &
          ASM_PID=$!
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/autonomous_asm_broadcaster.py --loop-seconds 240 || true
          else
            python3 scripts/autonomous_asm_broadcaster.py --loop-seconds 180 || true
          fi
          kill $ASM_PID 2>/dev/null || true
          python3 scripts/verify_real_onchain_proofs.py || true
          python3 scripts/verify_table2_hf_and_mudrex_pipeline.py || true
          mkdir -p docs/reports && cp -f index.html docs/index.html && cp -f reports/*.json docs/reports/ || true

      - name: Commit & Push Updated On-Chain Telemetry to GitHub Pages
        run: |
          git config user.name "arb-sniper-bot"
          git config user.email "arb-sniper-bot@users.noreply.github.com"
          git add index.html docs/index.html reports/two_hour_test_summary.json reports/verified_onchain_proofs.json reports/asm_sniper_telemetry.json reports/last_autonomous_broadcast.json docs/reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-sniper): auto-sync verified Arbitrum One on-chain proofs"
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Self-Chain Next 24/7 Cloud Sniper Worker (Runs Even When Laptop is Off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/arb_24x7_cloud_sniper.yml/dispatches \
            -d '{"ref":"main"}' || true
